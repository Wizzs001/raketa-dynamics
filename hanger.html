<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Explore the Raketa Dynamics hanger collection."
    >

    <title>Hanger | Raketa Dynamics</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


<!-- =========================================================
     HEADER
========================================================= -->

<header class="site-header">

    <div class="nav-container">

        <!-- LOGO -->
        <a href="index.html" class="brand">
            <img src="logo.png" alt="Raketa Dynamics">
        </a>


        <!-- SIMPLE MAIN NAVIGATION -->
        <nav class="simple-navigation" aria-label="Main navigation">

            <a href="index.html">
                HOME
            </a>

            <a href="supply.html">
                SUPPLY
            </a>

            <a href="archive.html">
                COLLECTION ARCHIVE
            </a>

            <a href="releases.html">
                UPDATES
            </a>

            <a href="about.html">
                ABOUT
            </a>

        </nav>

    </div>

</header>


<!-- =========================================================
     MAIN
========================================================= -->

<main>


    <!-- =====================================================
         PAGE HERO
    ====================================================== -->

    <section class="page-hero">

        <div class="container">

            <span class="section-kicker">
                RAKETA DYNAMICS / HANGER
            </span>

            <h1>
                Hanger.
            </h1>

            <p>
                Explore the Raketa Dynamics hanger collection.
            </p>

        </div>

    </section>


    <!-- =====================================================
         HANGER SECTION
    ====================================================== -->

    <section class="models-section">

        <div class="container">


            <!-- =================================================
                 AIRCRAFT
            ================================================== -->

            <div
                class="model-branch"
                id="aircraft"
            >

                <div class="model-branch-title">

                    <h2>
                        Aircraft
                    </h2>

                </div>


                <div class="model-list">


                    <!-- =========================================
                         PLACEHOLDER PRODUCT
                    ========================================== -->

                    <article
                        class="model-item"
                        onclick="this.classList.toggle('is-open')"
                    >

                        <div class="model-item-header">

                            <h3 class="model-item-title">
                                Hanger Product
                            </h3>

                            <span class="model-item-toggle">
                                +
                            </span>

                        </div>


                        <div class="model-gallery">


                            <div class="model-gallery-slide">

                                <img
                                    src="wip.png"
                                    alt="Hanger product work in progress"
                                >

                            </div>


                            <div class="model-gallery-slide">

                                <img
                                    src="WIPwhite.png"
                                    alt="Hanger product work in progress"
                                >

                            </div>


                        </div>


                        <div class="model-gallery-note">
                            Scroll to view images
                        </div>


                        <div class="model-item-content">

                            <div class="model-item-description">

                                <p>
                                    Hanger product information
                                    will be added here.
                                </p>


                                <a
                                    href="#"
                                    class="text-link model-details-link"
                                    onclick="event.stopPropagation()"
                                >
                                    Product details →
                                </a>

                            </div>

                        </div>


                    </article>


                </div>

            </div>


        </div>

    </section>


</main>


<!-- =========================================================
     FOOTER
========================================================= -->

<footer class="site-footer">

    <div class="container footer-bottom">

        <span>
            © 2026 Raketa Dynamics
        </span>

        <a href="index.html">
            Home
        </a>

    </div>

</footer>


</body>

</html>
